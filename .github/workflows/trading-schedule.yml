name: Trading Hours Schedule

# ─────────────────────────────────────────────────────────────────────────────
# 台灣期貨 + 美股交易時間排程控制
#
# 每週僅在完整休市期間（週六 05:30 CST ~ 週一 07:30 CST）關閉 Container App
# 與 PostgreSQL compute，節省約 50 小時/週的執行費用。
#
# 換算成 UTC（CST = UTC+8）：
#   關閉: 週五 21:30 UTC  →  週六 05:30 CST
#   開啟: 週日 23:30 UTC  →  週一 07:30 CST
#
# 手動觸發（國定假日 / 臨時停機）：
#   GitHub → Actions → Trading Hours Schedule → Run workflow → 選 start/stop
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 關閉: 週五 21:30 UTC = 週六 05:30 CST（台期夜盤結束後）
    - cron: '30 21 * * 5'
    # 開啟: 週日 23:30 UTC = 週一 07:30 CST（週一日盤前 1 小時）
    - cron: '30 23 * * 0'

  workflow_dispatch:
    inputs:
      action:
        description: '手動控制容器狀態'
        required: true
        type: choice
        options:
          - start
          - stop

env:
  CONTAINER_APP_NAME: trade-api-backend
  AZURE_RESOURCE_GROUP: trade-api-rg
  POSTGRES_SERVER_NAME: trade-db-server
  CONTAINER_APP_API_VERSION: '2026-01-01'

jobs:
  control-container-app:
    runs-on: ubuntu-latest
    steps:
      - name: Azure 登入
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 判斷執行動作 ──────────────────────────────────────────────────────
      - name: 判斷啟動或停止
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "reason=手動觸發" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "5" ]; then
            # GitHub cron 在 UTC 週五觸發 → 停止
            echo "action=stop" >> "$GITHUB_OUTPUT"
            echo "reason=週末休市排程（週六 05:30 CST）" >> "$GITHUB_OUTPUT"
          else
            # UTC 週日觸發 → 啟動
            echo "action=start" >> "$GITHUB_OUTPUT"
            echo "reason=週一開市排程（週一 07:30 CST）" >> "$GITHUB_OUTPUT"
          fi

      # ── 開啟：先確認 DB Ready，再啟動 Container App ─────────────────────
      - name: 開啟 PostgreSQL 與 Container App
        if: steps.action.outputs.action == 'start'
        run: |
          set -euo pipefail
          echo "▶️  開啟交易服務 — ${{ steps.action.outputs.reason }}"

          db_state="$(az postgres flexible-server show \
            --name "${{ env.POSTGRES_SERVER_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query state --output tsv)"

          case "$db_state" in
            Ready)
              echo "ℹ️  PostgreSQL 已是 Ready"
              ;;
            Stopped)
              az postgres flexible-server start \
                --name "${{ env.POSTGRES_SERVER_NAME }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --output none
              ;;
            *)
              echo "❌ PostgreSQL 狀態不適合啟動: $db_state"
              exit 1
              ;;
          esac

          for attempt in $(seq 1 60); do
            db_state="$(az postgres flexible-server show \
              --name "${{ env.POSTGRES_SERVER_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query state --output tsv)"
            if [ "$db_state" = "Ready" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "❌ PostgreSQL 未在 10 分鐘內進入 Ready（目前: $db_state）"
              exit 1
            fi
            sleep 10
          done

          app_id="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query id --output tsv)"
          app_state="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.runningStatus --output tsv)"

          if [ "$app_state" != "Running" ]; then
            az rest \
              --method post \
              --url "https://management.azure.com${app_id}/start?api-version=${{ env.CONTAINER_APP_API_VERSION }}" \
              --output none
          fi

          for attempt in $(seq 1 60); do
            app_state="$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query properties.runningStatus --output tsv)"
            if [ "$app_state" = "Running" ]; then
              echo "✅ PostgreSQL Ready，Container App Running"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "❌ Container App 未在 10 分鐘內進入 Running（目前: $app_state）"
              exit 1
            fi
            sleep 10
          done

      # ── 關閉：先停 App，確認停止後再停 DB compute ───────────────────────
      - name: 關閉 Container App 與 PostgreSQL
        if: steps.action.outputs.action == 'stop'
        run: |
          set -euo pipefail
          echo "⏹️  關閉交易服務 — ${{ steps.action.outputs.reason }}"

          app_id="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query id --output tsv)"
          app_state="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.runningStatus --output tsv)"
          db_state="$(az postgres flexible-server show \
            --name "${{ env.POSTGRES_SERVER_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query state --output tsv)"

          case "$db_state" in
            Ready|Stopped)
              ;;
            *)
              echo "❌ PostgreSQL preflight 狀態不適合停止: $db_state"
              exit 1
              ;;
          esac

          case "$app_state" in
            Running)
              az rest \
                --method post \
                --url "https://management.azure.com${app_id}/stop?api-version=${{ env.CONTAINER_APP_API_VERSION }}" \
                --output none
              ;;
            Stopped)
              echo "ℹ️  Container App 已是 Stopped"
              ;;
            *)
              echo "❌ Container App 狀態不適合停止: $app_state"
              exit 1
              ;;
          esac

          for attempt in $(seq 1 60); do
            app_state="$(az containerapp show \
              --name "${{ env.CONTAINER_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query properties.runningStatus --output tsv)"
            if [ "$app_state" = "Stopped" ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "❌ Container App 未在 10 分鐘內進入 Stopped（目前: $app_state）"
              exit 1
            fi
            sleep 10
          done

          case "$db_state" in
            Ready)
              az postgres flexible-server stop \
                --name "${{ env.POSTGRES_SERVER_NAME }}" \
                --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                --output none
              ;;
            Stopped)
              echo "ℹ️  PostgreSQL 已是 Stopped"
              ;;
            *)
              echo "❌ PostgreSQL 狀態不適合停止: $db_state"
              exit 1
              ;;
          esac

          echo "🛑 Container App 與 PostgreSQL compute 已停止"

      # ── 回報目前狀態 ──────────────────────────────────────────────────────
      - name: 驗證目前服務狀態
        run: |
          set -euo pipefail
          app_state="$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.runningStatus --output tsv)"
          db_state="$(az postgres flexible-server show \
            --name "${{ env.POSTGRES_SERVER_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query state --output tsv)"

          echo "Container App: $app_state"
          echo "PostgreSQL: $db_state"

          if [ "${{ steps.action.outputs.action }}" = "start" ]; then
            [ "$app_state" = "Running" ] && [ "$db_state" = "Ready" ]
          else
            [ "$app_state" = "Stopped" ] && [ "$db_state" = "Stopped" ]
          fi
